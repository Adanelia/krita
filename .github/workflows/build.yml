name: build

on: [push, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      # create directory structure for container control directory
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          repository: Adanelia/krita-docker-env
          ref: build
      - name: Prepare env
        run: mkdir persistent
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          path: persistent/krita
      - name: Build the docker image and run the container
        run: |
          # download the deps archive
          ./bin/bootstrap-deps.sh
          # build docker img
          ./bin/build_image
          ./bin/run_container
          # clean
          #rm -rf ./persistent/deps/_install
          # enter the docker container and build
          chmod +x bin/enter_and_build
          ./bin/enter_and_build
      - name: List dir
        run: ls -lh persistent
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.5.0
        with:
          name: linux
          path: persistent/*.AppImage
          retention-days: 1
