name: build

on: [push, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          repository: Grum999/KritaBuilder
      - name: Create a new build environment
        run: ./kbuilder new --source-path="https://github.com/Adanelia/krita.git -b build" --no-build -v krita-env
      - name: Build
        run: ./kbuilder build --deps --appimage -j8 -v my_build_environment
      - name: List dir
        run: ls -lah
      - name: List appimage dir
        run: ls -lah appimages
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.5.0
        with:
          name: linux
          path: appimages/*.AppImage
          retention-days: 1
